name: WBM Alarm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutuphaneleri kur
        run: pip install requests beautifulsoup4

      - name: WBM ilanlarini kontrol et
        run: python wbm_takip.py
