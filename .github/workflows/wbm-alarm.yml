name: WBM Alarm

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: wbm-alarm
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlari indir
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutuphaneleri kur
        run: pip install requests beautifulsoup4

      - name: WBM ilanlarini kontrol et
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python wbm_takip.py

      - name: Gorulen ilanlari kaydet
        run: |
          if [ -f gorulen_ilanlar.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gorulen_ilanlar.json
            if ! git diff --cached --quiet; then
              git commit -m "Gorulen WBM ilanlarini guncelle"
              git push
            fi
          fi
